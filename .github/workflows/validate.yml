name: Validate plugin releases
on:
  pull_request:
    branches: [main, testing]
  push:
    branches: [main, testing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Test publishing tools
        run: python3 -m unittest discover -s tests -v
      - name: Fetch pinned manifests
        run: python3 scripts/database.py fetch
      - name: Validate packages and summarize changes
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel=testing
          if [[ $TARGET_BRANCH == main ]]; then channel=stable; fi
          if git show-ref --verify --quiet refs/remotes/origin/publish; then
            git worktree add --detach "$RUNNER_TEMP/previous-publish" origin/publish
            previous_catalog="$RUNNER_TEMP/previous-publish/$channel/catalog.json"
          else
            previous_catalog="$RUNNER_TEMP/previous.json"
            printf '%s\n' '{"schemaVersion":1,"plugins":[]}' > "$previous_catalog"
          fi
          python3 scripts/database.py build --output "$RUNNER_TEMP/validated-catalog" --previous-catalog "$previous_catalog" --report "$RUNNER_TEMP/changes.md"
          cat "$RUNNER_TEMP/changes.md" >> "$GITHUB_STEP_SUMMARY"
