name: Plugin PR policy
on:
  pull_request_target:
    branches: [main, testing, publish]
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: plugin-registration
  cancel-in-progress: false
jobs:
  reject-publish:
    if: github.event.pull_request.base.ref == 'publish'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.issue.number});
            if (pr.state === 'open' && pr.base.ref === 'publish') {
              await github.rest.pulls.update({...context.repo, pull_number: pr.number, state: 'closed'});
              await core.summary.addRaw('publish 只接收自动生成的清单；该 PR 已关闭。').write();
            }
  validate:
    if: github.event.pull_request.base.ref != 'publish' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
      head: ${{ steps.policy.outputs.head }}
      base: ${{ steps.policy.outputs.base }}
      refs: ${{ steps.policy.outputs.refs }}
      repositories: ${{ steps.ownership.outputs.repositories }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Check allowed paths and Git object types
        id: policy
        run: python3 scripts/pr_policy.py
      - name: Test trusted validation tools
        if: steps.policy.outputs.allowed == 'true'
        run: python3 -m unittest discover -s tests -v
      - name: Verify namespaces and PR author repository permissions
        id: ownership
        if: steps.policy.outputs.allowed == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          VALIDATED_BASE: ${{ steps.policy.outputs.base }}
          PLUGIN_OWNERSHIP_TOKEN: ${{ secrets.PLUGIN_OWNERSHIP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_checkout="$RUNNER_TEMP/ownership-base"
          git worktree add --detach "$base_checkout" "$VALIDATED_BASE"
          python3 scripts/database.py fetch --root "$base_checkout"
          roots=("$base_checkout")
          other=main
          if [[ "$TARGET_BRANCH" == main ]]; then other=testing; fi
          if git show-ref --verify --quiet "refs/remotes/origin/$other"; then
            other_checkout="$RUNNER_TEMP/ownership-other"
            git worktree add --detach "$other_checkout" "origin/$other"
            python3 scripts/database.py fetch --root "$other_checkout"
            roots+=("$other_checkout")
          fi
          previous=()
          if git cat-file -e origin/publish:ownership.json 2>/dev/null; then
            git show origin/publish:ownership.json > "$RUNNER_TEMP/ownership-previous.json"
            previous=(--previous "$RUNNER_TEMP/ownership-previous.json")
          fi
          python3 scripts/database.py fetch --root "$RUNNER_TEMP/candidate"
          python3 scripts/ownership.py check --roots "${roots[@]}" --candidate "$RUNNER_TEMP/candidate" "${previous[@]}"
      - name: Download candidate packages and verify declared or Release SHA256
        if: steps.policy.outputs.allowed == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel=testing
          if [[ "$TARGET_BRANCH" == main ]]; then channel=stable; fi
          if git show-ref --verify --quiet refs/remotes/origin/publish; then
            git show "origin/publish:$channel/catalog.json" > "$RUNNER_TEMP/previous.json"
          else
            printf '%s\n' '{"schemaVersion":1,"plugins":[]}' > "$RUNNER_TEMP/previous.json"
          fi
          python3 scripts/database.py fetch --root "$RUNNER_TEMP/candidate"
          python3 scripts/database.py build --root "$RUNNER_TEMP/candidate" --output "$RUNNER_TEMP/validated-catalog" --previous-catalog "$RUNNER_TEMP/previous.json" --report "$RUNNER_TEMP/changes.md"
          cat "$RUNNER_TEMP/changes.md" >> "$GITHUB_STEP_SUMMARY"
  merge:
    needs: validate
    if: needs.validate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/github-script@v7
        id: merge
        env:
          VALIDATED_HEAD: ${{ needs.validate.outputs.head }}
          VALIDATED_REFS: ${{ needs.validate.outputs.refs }}
          VALIDATED_REPOSITORIES: ${{ needs.validate.outputs.repositories }}
          PLUGIN_OWNERSHIP_TOKEN: ${{ secrets.PLUGIN_OWNERSHIP_TOKEN }}
          VALIDATED_BASE: ${{ needs.validate.outputs.base }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            core.setOutput('merged', 'false');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.issue.number});
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== process.env.TARGET_BRANCH ||
                !['main', 'testing'].includes(pr.base.ref) ||
                pr.head.ref !== pr.base.ref ||
                pr.head.sha !== process.env.VALIDATED_HEAD || pr.base.sha !== process.env.VALIDATED_BASE) {
              await core.summary.addRaw('PR 或目标分支已变化，未合并；请更新 PR 分支以重新触发校验。').write();
              return;
            }
            for (const [branch, sha] of Object.entries(JSON.parse(process.env.VALIDATED_REFS))) {
              let actual = null;
              try {
                const {data: current} = await github.rest.repos.getBranch({...context.repo, branch});
                actual = current.commit.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (actual !== sha) {
                throw new Error(`${branch} 已变化，需要重新校验插件归属。`);
              }
            }
            for (const identity of JSON.parse(process.env.VALIDATED_REPOSITORIES)) {
              const [owner, repo] = identity.repository.split('/');
              const headers = process.env.PLUGIN_OWNERSHIP_TOKEN ? {authorization: `Bearer ${process.env.PLUGIN_OWNERSHIP_TOKEN}`} : {};
              const {data: source} = await github.request('GET /repos/{owner}/{repo}', {owner, repo, headers});
              if (source.id !== identity.repositoryId || source.owner.id !== identity.ownerId ||
                  source.full_name.toLowerCase() !== identity.repository || source.private) {
                throw new Error('插件仓库身份已变化，禁止转让或替换。');
              }
              if (source.owner.id !== pr.user.id) {
                const {data: access} = await github.request('GET /repos/{owner}/{repo}/collaborators/{username}/permission', {owner, repo, username: pr.user.login, headers});
                if (access.user.id !== pr.user.id || !['write', 'admin', 'maintain'].includes(access.permission)) {
                  throw new Error('PR 作者不再具有插件仓库写权限。');
                }
              }
            }
            const {data: result} = await github.rest.pulls.merge({
              ...context.repo, pull_number: pr.number,
              sha: process.env.VALIDATED_HEAD, merge_method: 'squash'
            });
            if (!result.merged) throw new Error(result.message);
            core.setOutput('merged', 'true');
            await core.summary.addRaw(`已合并 PR #${pr.number}。`).write();
  publish:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    secrets:
      PLUGIN_OWNERSHIP_TOKEN: ${{ secrets.PLUGIN_OWNERSHIP_TOKEN }}
